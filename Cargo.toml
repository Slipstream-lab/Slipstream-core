[workspace]
resolver = "2"
members = [
    "crates/footprint",
    "crates/scheduler",
    "crates/score",
    "crates/analyzer",
    "crates/replay",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Slipstream Lab"]
repository = "https://github.com/Slipstream-lab/Slipstream-core"
description = "Slipstream core analytical engine: transaction-footprint analysis, contention analysis, CAP-0063 scheduling, static analysis, replay and scoring."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
